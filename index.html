<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة - عيادة الأمل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --accent: #d4a853;
            --text-primary: #f5f5f5;
            --text-secondary: #8a8a9a;
            --border: #2a2a3a;
            --success: #4ade80;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { font-family: 'Tajawal', sans-serif; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
        }

        .bg-pattern {
            background-image: 
                radial-gradient(ellipse at 10% 10%, rgba(212, 168, 83, 0.08) 0%, transparent 40%),
                linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
        }

        .card-glass {
            background: linear-gradient(145deg, rgba(26, 26, 37, 0.9) 0%, rgba(18, 18, 26, 0.95) 100%);
            border: 1px solid var(--border);
        }

        .stat-box {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .stat-box:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(212, 168, 83, 0.15);
        }

        .stat-box.active {
            border-color: var(--accent);
            background: rgba(212, 168, 83, 0.1);
        }

        .checkbox-square {
            appearance: none;
            width: 26px;
            height: 26px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
        }

        .checkbox-square:checked {
            background: var(--success);
            border-color: var(--success);
        }

        .checkbox-square:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--bg-primary);
            font-size: 14px;
            font-weight: 900;
        }

        .checkbox-square:hover { border-color: var(--accent); }

        .patient-row {
            transition: all 0.25s ease;
            border-bottom: 1px solid var(--border);
        }

        .patient-row:hover { background: rgba(212, 168, 83, 0.04); }

        .patient-row.done { opacity: 0.5; }
        .patient-row.done .p-name { text-decoration: line-through; }

        .action-btn {
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .action-btn:hover { background: rgba(255,255,255,0.05); }

        .modal-bg {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }

        .input-field {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--accent) 0%, #c49a45 100%);
            color: var(--bg-primary);
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-save:hover { transform: translateY(-1px); box-shadow: 0 5px 20px rgba(212, 168, 83, 0.3); }

        .btn-cancel {
            border: 2px solid var(--border);
            transition: all 0.2s ease;
        }

        .btn-cancel:hover { border-color: var(--accent); }

        .btn-delete-confirm {
            background: var(--danger);
            color: white;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-delete-confirm:hover { opacity: 0.9; }

        .new-dot {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-pop { animation: popIn 0.25s ease; }

        .scroll-bar::-webkit-scrollbar { width: 6px; }
        .scroll-bar::-webkit-scrollbar-track { background: var(--bg-secondary); }
        .scroll-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .scroll-bar::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="bg-pattern">

    <!-- Header -->
    <header class="sticky top-0 z-30 border-b border-[var(--border)] bg-[var(--bg-primary)]/95 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-[var(--accent)] to-[#b8943d] flex items-center justify-center">
                    <svg class="w-6 h-6 text-[var(--bg-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-black">سستم إدارة الحجوزات</h1>
                    <p class="text-xs text-[var(--text-secondary)]">لوحة تحكم السكرتير</p>
                </div>
            </div>
           
        </div>
    </header>

    <!-- Main Layout -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- Sidebar - Stats -->
            <aside class="lg:col-span-3 space-y-4">

                <!-- حجوزات جديدة -->
                <div class="stat-box card-glass rounded-2xl p-5" onclick="showFilter('new')" data-filter="new">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-xl bg-[var(--accent)]/15 flex items-center justify-center">
                            <svg class="w-7 h-7 text-[var(--accent)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm text-[var(--text-secondary)]">حجوزات جديدة</p>
                            <p class="text-3xl font-black text-[var(--accent)]" id="countNew">0</p>
                        </div>
                    </div>
                </div>

                <!-- مكتملة -->
                <div class="stat-box card-glass rounded-2xl p-5" onclick="showFilter('completed')" data-filter="completed">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-xl bg-[var(--success)]/15 flex items-center justify-center">
                            <svg class="w-7 h-7 text-[var(--success)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm text-[var(--text-secondary)]">مكتملة</p>
                            <p class="text-3xl font-black text-[var(--success)]" id="countCompleted">0</p>
                        </div>
                    </div>
                </div>

                <!-- محذوفات -->
                <div class="stat-box card-glass rounded-2xl p-5" onclick="showFilter('deleted')" data-filter="deleted">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-xl bg-[var(--danger)]/15 flex items-center justify-center">
                            <svg class="w-7 h-7 text-[var(--danger)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm text-[var(--text-secondary)]">المحذوفات</p>
                            <p class="text-3xl font-black text-[var(--danger)]" id="countDeleted">0</p>
                        </div>
                    </div>
                </div>

                <!-- تنبيهات -->
                <div class="stat-box card-glass rounded-2xl p-5" onclick="openNotes()">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-xl bg-[var(--warning)]/15 flex items-center justify-center relative">
                            <svg class="w-7 h-7 text-[var(--warning)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                            </svg>
                            <span id="notesBadge" class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-[var(--danger)] text-xs flex items-center justify-center font-bold">0</span>
                        </div>
                        <div>
                            <p class="text-sm text-[var(--text-secondary)]">التنبيهات</p>
                            <p class="text-xl font-black text-[var(--warning)]">المطور</p>
                        </div>
                    </div>
                </div>

                <!-- زر عرض الكل -->
                <button onclick="showFilter('all')" class="w-full py-3 rounded-xl border-2 border-[var(--border)] hover:border-[var(--accent)] transition-colors font-bold">
                    عرض الكل
                </button>

            </aside>

            <!-- Main List -->
            <section class="lg:col-span-9">
                <div class="card-glass rounded-2xl overflow-hidden">
                    <!-- Header -->
                    <div class="p-5 border-b border-[var(--border)] flex items-center justify-between">
                        <h2 class="text-xl font-bold" id="listTitle">قائمة الحجوزات</h2>
                        <span class="text-sm text-[var(--text-secondary)]" id="listCount">0 مراجع</span>
                    </div>

                    <!-- List -->
                    <div class="max-h-[65vh] overflow-y-auto scroll-bar" id="patientList">
                        <!-- JS يملأها -->
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-bg absolute inset-0" onclick="closeEditModal()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="card-glass rounded-2xl p-6 w-full max-w-md modal-pop relative">
                <h3 class="text-xl font-bold mb-5">تعديل بيانات المراجع</h3>
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="mb-4">
                        <label class="block text-sm mb-2 text-[var(--text-secondary)]">الاسم الكامل</label>
                        <input type="text" id="editName" required class="input-field w-full px-4 py-3 rounded-xl">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm mb-2 text-[var(--text-secondary)]">العمر</label>
                        <input type="number" id="editAge" required class="input-field w-full px-4 py-3 rounded-xl">
                    </div>
                    <div class="mb-5">
                        <label class="block text-sm mb-2 text-[var(--text-secondary)]">الحالة</label>
                        <textarea id="editCondition" required rows="2" class="input-field w-full px-4 py-3 rounded-xl resize-none"></textarea>
                    </div>
                    <div class="flex gap-3">
                        <button type="submit" class="btn-save flex-1 py-3 rounded-xl">حفظ</button>
                        <button type="button" onclick="closeEditModal()" class="btn-cancel flex-1 py-3 rounded-xl">إلغاء</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-bg absolute inset-0" onclick="closeDeleteModal()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="card-glass rounded-2xl p-6 w-full max-w-sm modal-pop relative text-center">
                <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-[var(--danger)]/20 flex items-center justify-center">
                    <svg class="w-10 h-10 text-[var(--danger)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <h3 class="text-xl font-bold mb-2">تأكيد الحذف</h3>
                <p class="text-[var(--text-secondary)] mb-6">هل أنت متأكد من حذف هذا الحجز؟</p>
                <input type="hidden" id="deleteId">
                <div class="flex gap-3">
                    <button onclick="confirmDelete()" class="btn-delete-confirm flex-1 py-3 rounded-xl">حذف</button>
                    <button onclick="closeDeleteModal()" class="btn-cancel flex-1 py-3 rounded-xl">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notes Modal -->
    <div id="notesModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-bg absolute inset-0" onclick="closeNotes()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="card-glass rounded-2xl p-6 w-full max-w-md modal-pop relative">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-xl font-bold">تنبيهات المطور</h3>
                    <button onclick="showAddNote()" class="text-sm text-[var(--accent)] hover:underline">+ إضافة</button>
                </div>

                <!-- Add Note Form -->
                <div id="addNoteForm" class="hidden mb-4 p-4 rounded-xl bg-[var(--bg-secondary)] border border-[var(--border)]">
                    <textarea id="noteText" rows="2" placeholder="اكتب ملاحظتك هنا..." class="input-field w-full px-3 py-2 rounded-lg text-sm resize-none mb-3"></textarea>
                    <div class="flex gap-2">
                        <button onclick="addNote()" class="btn-save px-4 py-2 rounded-lg text-sm">إضافة</button>
                        <button onclick="hideAddNote()" class="btn-cancel px-4 py-2 rounded-lg text-sm">إلغاء</button>
                    </div>
                </div>

                <div class="space-y-3 max-h-72 overflow-y-auto scroll-bar" id="notesList">
                    <!-- JS يملأها -->
                </div>

                <button onclick="closeNotes()" class="btn-cancel w-full mt-5 py-3 rounded-xl">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        // البيانات
        let patients = [];
        let notes = [];
        let activeFilter = 'all';

        // بيانات تجريبية - 25 اسم
        const samplePatients = [
            { name: 'أحمد محمد علي الزبيدي', age: 35, condition: 'فحص ضغط الدم' },
            { name: 'فاطمة حسن إبراهيم', age: 28, condition: 'متابعة حمل - الشهر السادس' },
            { name: 'محمود عبدالله خالد', age: 45, condition: 'آلام المفاصل المزمنة' },
            { name: 'زينب علي حسين الجبوري', age: 32, condition: 'صداع نصفي متكرر' },
            { name: 'علي كريم محمد الساعدي', age: 55, condition: 'فحص سكر الدم الدوري' },
            { name: 'مريم أحمد جاسم', age: 22, condition: 'نزلة برد حادة' },
            { name: 'حسين علي محمد الربيعي', age: 40, condition: 'آلام أسفل الظهر' },
            { name: 'نورا محمود أحمد', age: 38, condition: 'فحص روتيني سنوي' },
            { name: 'كريم جاسم علي العبيدي', age: 50, condition: 'مشاكل في النوم والأرق' },
            { name: 'سارة حسين محمد', age: 26, condition: 'حساسية موسمية شديدة' },
            { name: 'يوسف علي أحمد الشمري', age: 8, condition: 'فحص نمو للأطفال' },
            { name: 'هدى محمود حسين', age: 60, condition: 'متابعة ضغط الدم' },
            { name: 'عمار محمد علي', age: 33, condition: 'آلام في الصدر' },
            { name: 'لبنى أحمد حسين الامارة', age: 29, condition: 'فحص ما قبل الزواج' },
            { name: 'قاسم علي محمد', age: 48, condition: 'دوخة ودوار متكرر' },
            { name: 'رنا حسين أحمد', age: 25, condition: 'آلام في البطن' },
            { name: 'حيدر محمد جاسم الكرخي', age: 42, condition: 'فحص القلب السنوي' },
            { name: 'نادية علي حسين', age: 65, condition: 'متابعة مرض السكري' },
            { name: 'مصطفى أحمد محمد', age: 30, condition: 'إصابة رياضية في القدم' },
            { name: 'دعاء حسين علي', age: 24, condition: 'طفح جلدي وحكة' },
            { name: 'علياء محمود أحمد', age: 36, condition: 'فحص الغدة الدرقية' },
            { name: 'حسن محمد علي الموسوي', age: 52, condition: 'ضيق في التنفس' },
            { name: 'آمنة علي حسين', age: 44, condition: 'آلام الرقبة والكتف' },
            { name: 'جعفر أحمد محمد', age: 31, condition: 'فحص دم شامل' },
            { name: 'زهراء حسين علي', age: 27, condition: 'مشاكل في الجهاز الهضمي' }
        ];

        // تهيئة البيانات
        function initData() {
            const saved = localStorage.getItem('clinic_bookings');
            const savedNotes = localStorage.getItem('clinic_notes');

            if (saved) {
                patients = JSON.parse(saved);
            } else {
                // إنشاء 25 حجز تجريبي
                const today = new Date();
                samplePatients.forEach((p, i) => {
                    const d = new Date(today);
                    d.setDate(d.getDate() + Math.floor(Math.random() * 5) - 2);
                    patients.push({
                        id: Date.now() + i,
                        name: p.name,
                        age: p.age,
                        condition: p.condition,
                        date: d.toISOString().split('T')[0],
                        status: Math.random() > 0.7 ? 'completed' : 'new',
                        deleted: false,
                        createdAt: new Date().toISOString()
                    });
                });
                savePatients();
            }

            if (savedNotes) {
                notes = JSON.parse(savedNotes);
            } else {
                notes = [
                    { id: 1, text: 'مرحباً بك في النظام - تم التثبيت بنجاح', time: 'الآن' },
                    { id: 2, text: 'للدعم الفني تواصل مع المطور', time: 'منذ ساعة' }
                ];
                saveNotes();
            }
        }

        function savePatients() {
            localStorage.setItem('clinic_bookings', JSON.stringify(patients));
        }

        function saveNotes() {
            localStorage.setItem('clinic_notes', JSON.stringify(notes));
        }

        // عرض القائمة
        function renderList() {
            const list = document.getElementById('patientList');
            let filtered = [];

            if (activeFilter === 'new') {
                filtered = patients.filter(p => p.status === 'new' && !p.deleted);
            } else if (activeFilter === 'completed') {
                filtered = patients.filter(p => p.status === 'completed' && !p.deleted);
            } else if (activeFilter === 'deleted') {
                filtered = patients.filter(p => p.deleted);
            } else {
                filtered = patients.filter(p => !p.deleted);
            }

            document.getElementById('listCount').textContent = filtered.length + ' مراجع';

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="p-12 text-center text-[var(--text-secondary)]">
                        <svg class="w-20 h-20 mx-auto mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <p class="text-lg">لا توجد حجوزات</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(p => `
                <div class="patient-row p-4 flex items-center gap-4 ${p.status === 'completed' ? 'done' : ''}">
                    
                    <!-- Checkbox -->
                    <input type="checkbox" 
                           class="checkbox-square" 
                           ${p.status === 'completed' ? 'checked' : ''} 
                           ${p.deleted ? 'disabled' : ''}
                           onchange="toggleDone(${p.id})"
                           aria-label="تم الفحص">

                    <!-- Dot for new -->
                    ${p.status === 'new' && !p.deleted ? '<div class="new-dot"></div>' : '<div class="w-2.5"></div>'}

                    <!-- Info -->
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="p-name font-bold text-lg truncate">${p.name}</span>
                            <span class="text-sm text-[var(--text-secondary)]">(${p.age} سنة)</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 text-sm text-[var(--text-secondary)]">
                            <span class="truncate">${p.condition}</span>
                            <span class="text-[var(--accent)]">${formatDate(p.date)}</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    ${!p.deleted ? `
                    <div class="flex items-center gap-1">
                        <button onclick="openEdit(${p.id})" class="action-btn text-[var(--accent)]" aria-label="تعديل">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                            </svg>
                        </button>
                        <button onclick="openDelete(${p.id})" class="action-btn text-[var(--danger)]" aria-label="حذف">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                        </button>
                    </div>
                    ` : `
                    <button onclick="restorePatient(${p.id})" class="text-sm text-[var(--accent)] hover:underline">استعادة</button>
                    `}
                </div>
            `).join('');
        }

        function formatDate(d) {
            const date = new Date(d);
            return date.getDate() + '/' + (date.getMonth() + 1) + '/' + date.getFullYear();
        }

        // تحديث العدادات
        function updateCounts() {
            document.getElementById('countNew').textContent = patients.filter(p => p.status === 'new' && !p.deleted).length;
            document.getElementById('countCompleted').textContent = patients.filter(p => p.status === 'completed' && !p.deleted).length;
            document.getElementById('countDeleted').textContent = patients.filter(p => p.deleted).length;
            document.getElementById('notesBadge').textContent = notes.length;
        }

        // فلترة
        function showFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.stat-box').forEach(b => b.classList.remove('active'));
            const box = document.querySelector(`[data-filter="${filter}"]`);
            if (box) box.classList.add('active');

            const titles = {
                'new': 'الحجوزات الجديدة',
                'completed': 'الحجوزات المكتملة',
                'deleted': 'المحذوفات',
                'all': 'جميع الحجوزات'
            };
            document.getElementById('listTitle').textContent = titles[filter];
            renderList();
        }

        // تبديل حالة الإكمال
        function toggleDone(id) {
            const p = patients.find(x => x.id === id);
            if (p) {
                p.status = p.status === 'completed' ? 'new' : 'completed';
                savePatients();
                renderList();
                updateCounts();
            }
        }

        // استعادة محذوف
        function restorePatient(id) {
            const p = patients.find(x => x.id === id);
            if (p) {
                p.deleted = false;
                p.status = 'new';
                savePatients();
                renderList();
                updateCounts();
            }
        }

        // Edit Modal
        function openEdit(id) {
            const p = patients.find(x => x.id === id);
            if (p) {
                document.getElementById('editId').value = id;
                document.getElementById('editName').value = p.name;
                document.getElementById('editAge').value = p.age;
                document.getElementById('editCondition').value = p.condition;
                document.getElementById('editModal').classList.remove('hidden');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        document.getElementById('editForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('editId').value);
            const p = patients.find(x => x.id === id);
            if (p) {
                p.name = document.getElementById('editName').value;
                p.age = parseInt(document.getElementById('editAge').value);
                p.condition = document.getElementById('editCondition').value;
                savePatients();
                renderList();
                closeEditModal();
            }
        });

        // Delete Modal
        let deleteTarget = null;

        function openDelete(id) {
            deleteTarget = id;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            deleteTarget = null;
        }

        function confirmDelete() {
            if (deleteTarget) {
                const p = patients.find(x => x.id === deleteTarget);
                if (p) {
                    p.deleted = true;
                    savePatients();
                    renderList();
                    updateCounts();
                }
            }
            closeDeleteModal();
        }

        // Notes Modal
        function openNotes() {
            renderNotes();
            document.getElementById('notesModal').classList.remove('hidden');
        }

        function closeNotes() {
            document.getElementById('notesModal').classList.add('hidden');
            document.getElementById('addNoteForm').classList.add('hidden');
        }

        function renderNotes() {
            const list = document.getElementById('notesList');
            if (notes.length === 0) {
                list.innerHTML = '<p class="text-center text-[var(--text-secondary)] py-8">لا توجد تنبيهات</p>';
                return;
            }
            list.innerHTML = notes.map(n => `
                <div class="p-4 rounded-xl bg-[var(--bg-secondary)] border border-[var(--border)] relative group">
                    <button onclick="deleteNote(${n.id})" class="absolute top-2 left-2 opacity-0 group-hover:opacity-100 transition-opacity text-[var(--danger)] p-1 rounded hover:bg-[var(--danger)]/20">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                    <p class="text-sm pr-6">${n.text}</p>
                    <span class="text-xs text-[var(--text-secondary)]">${n.time}</span>
                </div>
            `).join('');
        }

        function showAddNote() {
            document.getElementById('addNoteForm').classList.remove('hidden');
        }

        function hideAddNote() {
            document.getElementById('addNoteForm').classList.add('hidden');
            document.getElementById('noteText').value = '';
        }

        function addNote() {
            const text = document.getElementById('noteText').value.trim();
            if (text) {
                notes.unshift({ id: Date.now(), text: text, time: 'الآن' });
                saveNotes();
                updateCounts();
                renderNotes();
                hideAddNote();
            }
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            saveNotes();
            updateCounts();
            renderNotes();
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeEditModal();
                closeDeleteModal();
                closeNotes();
            }
        });

        // Init
        initData();
        renderList();
        updateCounts();
    </script>
</body>
</html>
